# Signaling remains on loopback behind the TLS proxy.
port: 7880
bind_addresses:
  - 127.0.0.1
key_file: /etc/livekit/keys.yaml
region: japaneast
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  node_ip: 40.81.202.35
  advertise_internal_ip: true
  congestion_control:
    enabled: true
    allow_pause: true
logging:
  level: info
  json: true
turn:
  enabled: true
  domain: turn.live.nashvel.com
  tls_port: 5349
  udp_port: 3478
  external_tls: true
  proxy_protocol: true
  proxy_protocol_trusted_cidrs:
    - 127.0.0.1/32
    - ::1/128
